
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minimapa de Mojoneras</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #edf1f5;
    color: #243449;
}

/* ENCABEZADO */
header {
    height: 65px;
    background: #142d4e;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    box-shadow: 0 2px 8px #0002;
    position: relative;
    z-index: 1000;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: #ffffff20;
    display: grid;
    place-items: center;
    font-size: 20px;
}

.logo h1 {
    margin: 0;
    font-size: 18px;
}

.logo small {
    display: block;
    margin-top: 3px;
    color: #cbd7e5;
    font-size: 11px;
}

.estado {
    font-size: 12px;
    color: #d9e5f2;
}

/* DISTRIBUCIÓN */
.contenedor {
    height: calc(100vh - 65px);
    display: grid;
    grid-template-columns: 290px 1fr;
    padding: 12px;
    gap: 12px;
}

/* PANEL LATERAL */
.panel {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 2px 10px #00000012;
}

.panel-cabecera {
    padding: 17px;
    border-bottom: 1px solid #e5eaf0;
}

.panel-cabecera h2 {
    margin: 0 0 5px;
    font-size: 16px;
    color: #142d4e;
}

.panel-cabecera p {
    margin: 0;
    font-size: 12px;
    color: #8491a1;
}

#buscador {
    width: 100%;
    margin-top: 14px;
    padding: 11px;
    border: 1px solid #dce3eb;
    border-radius: 7px;
    outline: none;
    font-size: 13px;
}

#buscador:focus {
    border-color: #426b98;
}

.resumen {
    padding: 12px 17px;
    background: #f7f9fb;
    font-size: 12px;
    color: #64748b;
    border-bottom: 1px solid #e5eaf0;
}

#lista {
    overflow-y: auto;
    flex: 1;
    padding: 9px;
}

.elemento {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px;
    border-radius: 7px;
    cursor: pointer;
    border: 1px solid transparent;
    margin-bottom: 4px;
    transition: .15s;
}

.elemento:hover {
    background: #f1f5f9;
}

.elemento.activo {
    background: #eaf1f8;
    border-color: #c6d6e7;
}

.punto-lista {
    width: 10px;
    height: 10px;
    background: #d94c42;
    border: 2px solid #f8c8c3;
    border-radius: 50%;
    flex-shrink: 0;
}

.nombre-lista {
    font-size: 13px;
    font-weight: bold;
    color: #30445b;
}

/* MAPA */
.mapa-contenedor {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 10px #00000012;
}

#mapa {
    height: 100%;
    width: 100%;
    background: #e6ebef;
}

/* TARJETA FLOTANTE */
.ficha {
    position: absolute;
    z-index: 500;
    top: 15px;
    right: 15px;
    width: 280px;
    max-height: calc(100% - 30px);
    overflow-y: auto;
    background: white;
    border-radius: 10px;
    box-shadow: 0 3px 16px #0003;
    display: none;
}

.ficha.visible {
    display: block;
}

.ficha-cabecera {
    background: #142d4e;
    color: white;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.ficha-cabecera h2 {
    margin: 0;
    font-size: 17px;
}

.cerrar {
    border: 0;
    background: transparent;
    color: white;
    font-size: 22px;
    cursor: pointer;
}

.ficha-contenido {
    padding: 15px;
}

.dato {
    padding: 9px 0;
    border-bottom: 1px solid #edf0f3;
    font-size: 12px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

.dato strong {
    display: block;
    color: #52677f;
    font-size: 11px;
    margin-bottom: 2px;
}

.boton-pdf {
    display: block;
    text-align: center;
    background: #142d4e;
    color: white;
    text-decoration: none;
    padding: 11px;
    margin-top: 14px;
    border-radius: 6px;
    font-size: 13px;
}

.boton-pdf:hover {
    background: #294e77;
}

/* ETIQUETAS DEL MAPA */
.etiqueta-mojonera {
    background: white;
    border: 1px solid #142d4e;
    border-radius: 4px;
    color: #142d4e;
    font-weight: bold;
    font-size: 11px;
    padding: 3px 5px;
    box-shadow: 0 1px 4px #00000040;
}

/* INDICADOR */
.leyenda {
    position: absolute;
    bottom: 20px;
    left: 15px;
    z-index: 500;
    background: white;
    padding: 10px 13px;
    border-radius: 7px;
    box-shadow: 0 2px 8px #0002;
    font-size: 11px;
    color: #526579;
}

.leyenda-punto {
    display: inline-block;
    width: 9px;
    height: 9px;
    background: #d94c42;
    border-radius: 50%;
    margin-right: 6px;
}

/* CELULAR */
@media(max-width: 750px) {
    header {
        height: 58px;
        padding: 0 12px;
    }

    .logo h1 {
        font-size: 15px;
    }

    .estado {
        font-size: 10px;
    }

    .contenedor {
        height: calc(100vh - 58px);
        display: flex;
        flex-direction: column;
        padding: 8px;
        gap: 8px;
    }

    .panel {
        flex: 0 0 175px;
    }

    .panel-cabecera {
        padding: 10px 12px;
    }

    .panel-cabecera h2 {
        font-size: 14px;
    }

    #buscador {
        margin-top: 8px;
        padding: 8px;
    }

    .resumen {
        padding: 7px 12px;
    }

    #lista {
        display: flex;
        overflow-x: auto;
        overflow-y: hidden;
        flex: 1;
        padding: 7px;
        gap: 5px;
    }

    .elemento {
        flex: 0 0 auto;
        margin: 0;
        padding: 8px;
    }

    .mapa-contenedor {
        flex: 1;
        min-height: 250px;
    }

    .ficha {
        width: min(270px, calc(100% - 20px));
        top: 10px;
        right: 10px;
        max-height: 75%;
    }

    .leyenda {
        bottom: 12px;
        left: 10px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        <div class="logo-icon">⌖</div>
        <div>
            <h1>Visor de Mojoneras</h1>
            <small>Control de puntos topográficos</small>
        </div>
    </div>

    <div class="estado" id="estado">Cargando puntos...</div>
</header>

<div class="contenedor">

    <aside class="panel">

        <div class="panel-cabecera">
            <h2>Localización de puntos</h2>
            <p>Selecciona una mojonera para consultar sus datos.</p>

            <input
                type="text"
                id="buscador"
                placeholder="Buscar por nombre..."
            >
        </div>

        <div class="resumen" id="resumen">
            Cargando mojoneras...
        </div>

        <div id="lista"></div>

    </aside>

    <main class="mapa-contenedor">

        <div id="mapa"></div>

        <div class="leyenda">
            <span class="leyenda-punto"></span>
            Mojonera registrada
        </div>

        <div class="ficha" id="ficha">

            <div class="ficha-cabecera">
                <h2 id="titulo-ficha">Mojonera</h2>
                <button class="cerrar" onclick="cerrarFicha()">×</button>
            </div>

            <div class="ficha-contenido" id="contenido-ficha"></div>

        </div>

    </main>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>

// INICIALIZAR MAPA
const mapa = L.map('mapa', {
    zoomControl: true
}).setView([19.2112, -103.8042], 18);

// MAPA BASE
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
}).addTo(mapa);

// VARIABLES
let mojoneras = [];
let marcadores = [];
let seleccionActual = null;

// CARGAR CSV
Papa.parse('Mojoneras_Fic.csv', {
    download: true,
    header: true,
    skipEmptyLines: true,

    complete: function(resultado) {

        mojoneras = resultado.data.filter(m => {
            return m.Mojonera &&
                Number.isFinite(Number(m.Latitud)) &&
                Number.isFinite(Number(m.Longitud)) &&
                m.Latitud !== '' &&
                m.Longitud !== '';
        });

        if (mojoneras.length === 0) {
            document.getElementById('estado').textContent =
                'No se encontraron puntos';
            return;
        }

        document.getElementById('estado').textContent =
            mojoneras.length + ' puntos registrados';

        document.getElementById('resumen').textContent =
            mojoneras.length + ' mojoneras disponibles';

        crearMarcadores();
        mostrarLista(mojoneras);
    },

    error: function() {
        document.getElementById('estado').textContent =
            'Error al cargar el CSV';
        alert('No se pudo cargar Mojoneras_Fic.csv');
    }
});


// CREAR MARCADORES
function crearMarcadores() {

    const coordenadas = [];

    mojoneras.forEach(m => {

        const lat = Number(m.Latitud);
        const lon = Number(m.Longitud);

        const marcador = L.marker([lat, lon]).addTo(mapa);

        // ETIQUETA PERMANENTE
        marcador.bindTooltip(m.Mojonera, {
            permanent: true,
            direction: 'top',
            offset: [0, -10],
            opacity: 1,
            className: 'etiqueta-mojonera'
        });

        marcador.on('click', () => {
            seleccionar(m);
        });

        marcadores.push(marcador);
        coordenadas.push([lat, lon]);
    });

    if (coordenadas.length > 0) {
        mapa.fitBounds(coordenadas, {
            padding: [35, 35],
            maxZoom: 20
        });
    }
}


// MOSTRAR LISTADO
function mostrarLista(datos) {

    const lista = document.getElementById('lista');
    lista.innerHTML = '';

    datos.forEach(m => {

        const elemento = document.createElement('div');
        elemento.className = 'elemento';

        const punto = document.createElement('span');
        punto.className = 'punto-lista';

        const nombre = document.createElement('span');
        nombre.className = 'nombre-lista';
        nombre.textContent = m.Mojonera;

        elemento.appendChild(punto);
        elemento.appendChild(nombre);

        elemento.addEventListener('click', () => {
            seleccionar(m);
        });

        if (seleccionActual === m.Mojonera) {
            elemento.classList.add('activo');
        }

        lista.appendChild(elemento);
    });
}


// SELECCIONAR MOJONERA
function seleccionar(m) {

    seleccionActual = m.Mojonera;

    const lat = Number(m.Latitud);
    const lon = Number(m.Longitud);

    // ACERCAR MAPA
    mapa.flyTo([lat, lon], 20, {
        duration: 0.8
    });

    // ACTUALIZAR FICHA
    document.getElementById('titulo-ficha').textContent =
        m.Mojonera;

    const contenido = document.getElementById('contenido-ficha');
    contenido.innerHTML = '';

    agregarDato(contenido, 'Elevación', m.Elevacion + ' m');

    agregarDato(
        contenido,
        'Coordenadas UTM',
        'Este (E): ' + m.E + '\nNorte (N): ' + m.N
    );

    agregarDato(
        contenido,
        'Coordenadas topográficas',
        'X: ' + m.X + '\nY: ' + m.Y
    );

    agregarDato(
        contenido,
        'Coordenadas geográficas',
        'Latitud: ' + m.Latitud + '\nLongitud: ' + m.Longitud
    );

    const boton = document.createElement('a');
    boton.className = 'boton-pdf';
    boton.href = 'cedulas/' + encodeURIComponent(m.Mojonera) + '.pdf';
    boton.target = '_blank';
    boton.rel = 'noopener';
    boton.textContent = 'Abrir cédula PDF';

    contenido.appendChild(boton);

    document.getElementById('ficha').classList.add('visible');

    mostrarLista(mojoneras);
}


// AGREGAR DATOS A LA FICHA
function agregarDato(contenedor, titulo, valor) {

    const bloque = document.createElement('div');
    bloque.className = 'dato';

    const etiqueta = document.createElement('strong');
    etiqueta.textContent = titulo;

    const texto = document.createElement('div');
    texto.style.whiteSpace = 'pre-line';
    texto.textContent = valor ?? '';

    bloque.appendChild(etiqueta);
    bloque.appendChild(texto);

    contenedor.appendChild(bloque);
}


// CERRAR FICHA
function cerrarFicha() {
    document.getElementById('ficha').classList.remove('visible');
}


// BUSCADOR
document.getElementById('buscador').addEventListener('input', function() {

    const texto = this.value.toLowerCase().trim();

    const filtradas = mojoneras.filter(m =>
        m.Mojonera.toLowerCase().includes(texto)
    );

    mostrarLista(filtradas);
});

</script>

</body>
</html>
